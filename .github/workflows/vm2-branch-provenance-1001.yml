name: VM2 Branch Provenance 1001
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  victim:
    name: vm2-branchprov-victim
    runs-on: ubuntu-latest
    steps:
      - name: Controlled attempt discriminator
        run: |
          echo "HEAD_REF=${{ github.head_ref }}"
          echo "BASE_REF=${{ github.base_ref }}"
          echo "RUN_ATTEMPT=${{ github.run_attempt }}"
          if [ "${{ github.run_attempt }}" = "1" ]; then
            echo "VM2_BRANCHPROV_VICTIM_FAIL"
            exit 1
          fi
          echo "VM2_BRANCHPROV_VICTIM_PASS"
  write_side_effect:
    name: vm2-branchprov-write-side-effect
    runs-on: ubuntu-latest
    steps:
      - name: Controlled target-repo release
        uses: actions/github-script@v8
        with:
          script: |
            const tag = `vm2-branchprov-${context.runId}-attempt-${process.env.GITHUB_RUN_ATTEMPT}`;
            await github.rest.repos.createRelease({owner: context.repo.owner, repo: context.repo.repo, tag_name: tag, target_commitish: context.sha, name: tag, body: `VM2 controlled branch-provenance side effect attempt=${process.env.GITHUB_RUN_ATTEMPT}`});
